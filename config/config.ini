[general]
# Application under test (override: BASE_URL env var or --base-url)
base_url = https://automationexercise.com

# chrome | firefox   (override: BROWSER env var or --browser)
browser = chrome

# true = no visible window (override: HEADLESS env var or --headless true/false)
headless = true

# Seconds an explicit wait polls for a condition
explicit_wait = 15

# Seconds before a page load is abandoned
page_load_timeout = 45

[healing]
# Rule-based locator recovery (utils/healing_agent.py). Not AI.
# Override: HEALING_ENABLED env var or --healing on|off
enabled = true

[test_data]
# Intentionally invalid credentials for the negative login test
invalid_email = not_registered_user@example.com
invalid_password = WrongPassword123
