[general]
# Application under test - a full e-commerce site built for automation practice
base_url = https://automationexercise.com

# Default browser: chrome | firefox  (override from CLI with --browser)
browser = chrome

# Run without a visible UI window (override from CLI with --headless true/false)
headless = False

# Maximum seconds an explicit wait will poll for a condition
explicit_wait = 15

[test_data]
# Intentionally invalid credentials for the negative login test
invalid_email = not_registered_user@example.com
invalid_password = WrongPassword123
