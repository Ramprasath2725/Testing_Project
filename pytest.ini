[pytest]
testpaths = tests
python_files = test_*.py

# Select suites with markers, e.g.  pytest -m smoke   |  pytest -m "not unit"
markers =
    unit: Fast framework tests that need no browser and no network.
    smoke: Quick sanity checks on the most critical paths.
    regression: Full regression suite.
    e2e: End-to-end user journeys (register -> shop -> pay).
    auth: Registration, login and logout.
    login: Login functionality tests.
    products: Product listing, search, details, categories, brands.
    cart: Cart behaviour.
    checkout: Checkout and order placement.
    contact: Contact form and footer subscription.

# -ra            : summary of every non-passing outcome
# --strict-markers: unregistered markers fail the run
# HTML + JUnit reports are written to reports/ (git-ignored).
addopts = -v -ra --strict-markers --tb=short
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml

# Live console logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
