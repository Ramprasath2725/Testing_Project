name: Selenium PyTest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest -m expression for the UI job (e.g. smoke, 'not e2e')"
        default: "not unit"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Framework unit tests (no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -m unit --html=reports/unit-report.html --junitxml=reports/unit-junit.xml
      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: reports/
          if-no-files-found: ignore

  ui:
    name: UI tests (Chrome, headless)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      # --reruns 1: the target is a public demo site that occasionally times out.
      # A rerun is shown as such in the report, so it is never silently hidden.
      - name: Run UI tests
        run: >
          pytest -m "${{ github.event.inputs.marker || 'not unit' }}"
          --headless true -n 2 --reruns 1 --reruns-delay 2
          --html=reports/ui-report.html --self-contained-html
          --junitxml=reports/ui-junit.xml
      - name: Upload HTML/JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-reports
          path: reports/
          if-no-files-found: ignore
      - name: Upload failure screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-and-logs
          path: |
            screenshots/
            logs/
          if-no-files-found: ignore
